<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitr — Section Detail</title>
  <meta name="description" content="View spending details and transaction history for this section.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">

  <div id="sidebar-container"></div>

  <div class="main">
    <div id="mobile-header-container"></div>
    <div class="page-wrap">
      <div class="page-inner page-enter">

        <button class="back-btn" id="back-btn">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back to sections
        </button>

        <!-- Loading placeholder -->
        <div id="section-loading">
          <div class="skeleton skeleton-block" style="height:180px;margin-bottom:16px;"></div>
          <div class="skeleton skeleton-block" style="height:80px;margin-bottom:16px;"></div>
          <div class="skeleton skeleton-text" style="margin-bottom:8px;"></div>
          <div class="skeleton skeleton-text" style="width:60%;"></div>
        </div>

        <!-- Section Hero -->
        <div id="section-hero" class="hidden">
          <div class="section-hero">
            <div class="section-hero-emoji" id="hero-emoji"></div>
            <div class="section-hero-name" id="hero-name"></div>
            <div class="section-hero-remaining" id="hero-remaining"></div>
            <div class="section-hero-label">remaining this month</div>
            <div class="progress-track" style="height:6px;max-width:240px;margin:0 auto;">
              <div class="progress-fill" id="hero-progress" style="width:0%"></div>
            </div>
          </div>

          <!-- Stats -->
          <div class="stat-row" style="margin-bottom:20px;">
            <div class="stat-box">
              <div class="stat-box-label">Budget</div>
              <div class="stat-box-value" id="stat-budget">—</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">Spent</div>
              <div class="stat-box-value text-red" id="stat-spent">—</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">Remaining</div>
              <div class="stat-box-value text-green" id="stat-remaining">—</div>
            </div>
          </div>

          <!-- Status indicator -->
          <div id="status-msg" class="spend-nudge ok hidden" style="margin-bottom:20px;"></div>

          <!-- Transaction History -->
          <div>
            <div class="section-label">
              Transaction history
              <span id="tx-count" class="text-muted text-sm"></span>
            </div>
            <div class="card card-sm">
              <div class="tx-list" id="tx-history"></div>
              <div id="tx-empty" class="hidden" style="text-align:center;padding:24px 0;color:var(--n-400);font-size:13px;">
                No transactions yet in this section.
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="card-actions" style="margin-top:20px;flex-direction:column;gap:10px;">
            <button class="btn btn-secondary" id="btn-edit-section">Edit section</button>
            <button class="btn btn-danger" id="btn-delete-section">Delete section</button>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div id="bottom-nav-container"></div>
</div>

<!-- Edit Section Modal -->
<div class="overlay" id="edit-overlay" role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <div class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-title" id="edit-title">Edit section</div>
    <div class="sheet-subtitle">Update the name, icon, or budget.</div>

    <div class="input-group">
      <label class="input-label" for="edit-name">Section name</label>
      <input type="text" id="edit-name" class="input" autocomplete="off" maxlength="40">
    </div>

    <div class="input-group">
      <label class="input-label" for="edit-emoji">Icon (emoji)</label>
      <input type="text" id="edit-emoji" class="input" maxlength="4" style="font-size:20px;">
    </div>

    <div class="input-group">
      <label class="input-label" for="edit-budget">Monthly budget</label>
      <div class="input-prefix-wrap">
        <span class="input-prefix">₹</span>
        <input type="number" id="edit-budget" class="input" min="1" inputmode="numeric">
      </div>
    </div>

    <div id="edit-error" class="hidden" style="background:var(--red-50);border:1px solid var(--red-100);color:var(--red-600);font-size:13px;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:14px;"></div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" id="btn-edit-cancel" style="flex:1;">Cancel</button>
      <button class="btn btn-primary" id="btn-edit-save" style="flex:2;">Save changes</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="overlay" id="delete-overlay" role="dialog" aria-modal="true" aria-labelledby="delete-title">
  <div class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-title" id="delete-title" style="color:var(--red-600);">Delete section?</div>
    <div class="sheet-subtitle" id="delete-msg">This cannot be undone.</div>

    <div class="input-group">
      <label class="input-label" for="delete-confirm-input">Type <strong>Delete</strong> to confirm</label>
      <input type="text" id="delete-confirm-input" class="input" placeholder='Type "Delete"' autocomplete="off">
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" id="btn-delete-cancel" style="flex:1;">Cancel</button>
      <button class="btn btn-danger" id="btn-delete-confirm" disabled style="flex:2;">Delete section</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module" src="/js/app.js"></script>
<script type="module">
  import {
    api, formatINR, timeAgo, sectionColour,
    getRemaining, getPctSpent, navigate, toast
  } from '/js/utils.js';

  const params = new URLSearchParams(location.search);
  const sectionId = params.get('id');
  let section = null;

  if (!sectionId) navigate('/pages/sections.html');

  document.getElementById('back-btn').addEventListener('click', () => navigate('/pages/sections.html'));

  async function load() {
    try {
      const [sec, txData] = await Promise.all([
        api('GET', `/sections/${sectionId}`),
        api('GET', `/transactions?section=${sectionId}`),
      ]);
      section = sec;
      renderHero(sec);
      renderTransactions(txData || []);
    } catch (e) {
      if (e.type !== 'auth') {
        document.getElementById('section-loading').innerHTML = '<div class="error-state"><div class="error-state-title">Could not load section.</div><button class="btn btn-secondary" onclick="location.reload()">Try again</button></div>';
      }
    }
  }

  function renderHero(sec) {
    document.getElementById('section-loading').classList.add('hidden');
    document.getElementById('section-hero').classList.remove('hidden');

    document.title = `Splitr — ${sec.name}`;

    const remaining = getRemaining(sec.monthlyBudget, sec.spent);
    const pctSpent  = getPctSpent(sec.monthlyBudget, sec.spent);
    const colour    = sectionColour(sec.monthlyBudget, sec.spent);

    document.getElementById('hero-emoji').textContent     = sec.emoji || '📦';
    document.getElementById('hero-name').textContent      = sec.name;
    document.getElementById('hero-remaining').textContent = formatINR(remaining);
    document.getElementById('hero-remaining').style.color = colour === 'green' ? 'var(--green-600)' : colour === 'amber' ? 'var(--amber-600)' : 'var(--red-500)';

    const progressEl = document.getElementById('hero-progress');
    progressEl.style.width   = `${pctSpent}%`;
    progressEl.className     = `progress-fill ${colour}`;

    document.getElementById('stat-budget').textContent    = formatINR(sec.monthlyBudget);
    document.getElementById('stat-spent').textContent     = formatINR(sec.spent);
    document.getElementById('stat-remaining').textContent = formatINR(remaining);

    const msgEl = document.getElementById('status-msg');
    if (pctSpent >= 100) {
      msgEl.className = 'spend-nudge danger';
      msgEl.textContent = 'This section has reached its budget limit.';
      msgEl.classList.remove('hidden');
    } else if (pctSpent >= 80) {
      msgEl.className = 'spend-nudge warn';
      msgEl.textContent = `${pctSpent}% of budget used — ${formatINR(remaining)} left.`;
      msgEl.classList.remove('hidden');
    } else {
      msgEl.classList.add('hidden');
    }
  }

  function renderTransactions(transactions) {
    const list  = document.getElementById('tx-history');
    const empty = document.getElementById('tx-empty');
    const count = document.getElementById('tx-count');

    if (!transactions || transactions.length === 0) {
      empty.classList.remove('hidden');
      count.textContent = '';
      return;
    }
    empty.classList.add('hidden');
    count.textContent = `${transactions.length} transaction${transactions.length !== 1 ? 's' : ''}`;

    list.innerHTML = transactions.map(tx => {
      const isCredit = tx.direction === 'credit';
      return `
        <div class="tx-row">
          <div class="tx-icon-wrap">${section?.emoji || '💳'}</div>
          <div class="tx-info">
            <div class="tx-merchant">${tx.merchant}</div>
            <div class="tx-meta">${timeAgo(tx.createdAt)}${tx.isOverride ? ' · <span style="color:var(--amber-600);">Override</span>' : ''}</div>
          </div>
          <div class="tx-amount-wrap">
            <div class="tx-amount ${isCredit ? 'credit' : ''}">${isCredit ? '+' : '-'}${formatINR(tx.amount)}</div>
            <div class="tx-time">${new Date(tx.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Edit Section
  document.getElementById('btn-edit-section').addEventListener('click', () => {
    if (!section) return;
    document.getElementById('edit-name').value   = section.name;
    document.getElementById('edit-emoji').value  = section.emoji || '';
    document.getElementById('edit-budget').value = section.monthlyBudget;
    document.getElementById('edit-overlay').classList.add('show');
  });

  document.getElementById('btn-edit-cancel').addEventListener('click', () => {
    document.getElementById('edit-overlay').classList.remove('show');
  });

  document.getElementById('btn-edit-save').addEventListener('click', async () => {
    const name   = document.getElementById('edit-name').value.trim();
    const emoji  = document.getElementById('edit-emoji').value.trim();
    const budget = Number(document.getElementById('edit-budget').value);
    const btn    = document.getElementById('btn-edit-save');
    const errEl  = document.getElementById('edit-error');

    if (!name || !budget || budget < 1) {
      errEl.textContent = 'Name and budget are required.';
      errEl.classList.remove('hidden');
      return;
    }
    errEl.classList.add('hidden');
    btn.classList.add('btn-loading');

    try {
      const updated = await api('PATCH', `/sections/${sectionId}`, { name, emoji, monthlyBudget: budget });
      section = updated;
      renderHero(updated);
      document.getElementById('edit-overlay').classList.remove('show');
      toast('Section updated.', 'success');
    } catch (err) {
      errEl.textContent = err.message || 'Could not update section.';
      errEl.classList.remove('hidden');
    } finally {
      btn.classList.remove('btn-loading');
    }
  });

  // Delete Section
  document.getElementById('btn-delete-section').addEventListener('click', () => {
    if (!section) return;
    document.getElementById('delete-msg').textContent =
      `All ${section.name} data will be removed. This cannot be undone.`;
    document.getElementById('delete-confirm-input').value = '';
    document.getElementById('btn-delete-confirm').disabled = true;
    document.getElementById('delete-overlay').classList.add('show');
  });

  document.getElementById('delete-confirm-input').addEventListener('input', e => {
    document.getElementById('btn-delete-confirm').disabled =
      e.target.value.toLowerCase() !== 'delete';
  });

  document.getElementById('btn-delete-cancel').addEventListener('click', () => {
    document.getElementById('delete-overlay').classList.remove('show');
  });

  document.getElementById('btn-delete-confirm').addEventListener('click', async () => {
    const btn = document.getElementById('btn-delete-confirm');
    btn.classList.add('btn-loading');
    try {
      await api('DELETE', `/sections/${sectionId}`);
      toast('Section deleted.', 'success');
      navigate('/pages/sections.html');
    } catch (err) {
      toast(err.message || 'Could not delete section.', 'error');
      btn.classList.remove('btn-loading');
    }
  });

  // Close modals on overlay click / Escape
  ['edit-overlay', 'delete-overlay'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.overlay.show').forEach(el => el.classList.remove('show'));
    }
  });

  load();
</script>
</body>
</html>
