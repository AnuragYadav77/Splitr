<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitr — Pay</title>
  <meta name="description" content="Log a payment — see how it affects your section before confirming.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .pay-step { display: none; }
    .pay-step.active { display: block; }

    .amount-input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--n-200);
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .amount-input-wrap:focus-within { border-color: var(--indigo-500); }

    .amount-prefix {
      font-size: 32px;
      font-weight: 700;
      color: var(--n-400);
    }

    #inp-amount {
      font-size: 48px;
      font-weight: 700;
      color: var(--n-900);
      border: none;
      outline: none;
      background: transparent;
      width: 200px;
      text-align: center;
      font-family: var(--font);
      letter-spacing: -2px;
    }
    #inp-amount::placeholder { color: var(--n-200); }
  </style>
</head>
<body>
<div class="app-shell">

  <div id="sidebar-container"></div>

  <div class="main">
    <div id="mobile-header-container"></div>
    <div class="page-wrap">
      <div class="page-inner page-enter" style="max-width:480px;">

        <button class="back-btn" id="back-btn">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>

        <h1 class="page-title" id="step-title" style="margin-bottom:24px;">Log a payment</h1>

        <!-- STEP 1: Merchant + Amount -->
        <div class="pay-step active" id="pstep-1">
          <div class="input-group">
            <label class="input-label" for="inp-merchant">Who did you pay?</label>
            <input type="text" id="inp-merchant" class="input" placeholder="e.g. Swiggy, Uber, DMart" autocomplete="off" maxlength="80">
            <div class="input-error-msg" id="err-merchant"></div>
          </div>

          <div class="input-group">
            <label class="input-label" style="text-align:center;display:block;">Amount</label>
            <div class="amount-input-wrap">
              <span class="amount-prefix">₹</span>
              <input type="number" id="inp-amount" placeholder="0" min="0.01" step="0.01" inputmode="decimal">
            </div>
            <div class="input-error-msg" id="err-amount"></div>
          </div>

          <button class="btn btn-primary btn-full btn-lg" id="btn-p1-next" style="margin-top:8px;">
            Choose section
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- STEP 2: Choose Section -->
        <div class="pay-step" id="pstep-2">
          <div style="text-align:center;margin-bottom:20px;">
            <div class="text-muted text-sm">Paying</div>
            <div style="font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--n-900);" id="conf-amount-display"></div>
            <div style="font-size:15px;font-weight:600;color:var(--n-700);margin-top:4px;" id="conf-merchant-display"></div>
          </div>

          <div class="section-label">Pay from which section?</div>
          <div class="payment-section-select" id="section-select-grid">
            <div class="skeleton skeleton-block" style="height:80px;"></div>
            <div class="skeleton skeleton-block" style="height:80px;"></div>
            <div class="skeleton skeleton-block" style="height:80px;"></div>
            <div class="skeleton skeleton-block" style="height:80px;"></div>
          </div>

          <div id="budget-warning" class="spend-nudge warn hidden" style="margin-top:12px;"></div>

          <button class="btn btn-primary btn-full btn-lg" id="btn-p2-confirm" disabled style="margin-top:16px;">
            Review payment
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- STEP 3: Confirmation -->
        <div class="pay-step" id="pstep-3">
          <div class="section-hero" style="margin-bottom:20px;">
            <div class="text-muted text-sm" style="margin-bottom:4px;">You're paying</div>
            <div style="font-size:42px;font-weight:700;letter-spacing:-2px;color:var(--n-900);line-height:1;" id="conf-amount"></div>
            <div style="font-size:16px;font-weight:600;color:var(--n-700);margin-top:8px;" id="conf-merchant"></div>
          </div>

          <!-- Financial awareness -->
          <div id="conf-awareness" class="spend-nudge ok" style="margin-bottom:16px;"></div>

          <div class="card card-sm" style="margin-bottom:20px;">
            <div style="font-size:12px;color:var(--n-400);margin-bottom:4px;">From section</div>
            <div style="font-size:16px;font-weight:700;color:var(--n-800);" id="conf-section-name"></div>
            <div style="font-size:13px;color:var(--n-500);margin-top:2px;" id="conf-section-after"></div>
          </div>

          <div style="display:flex;gap:10px;">
            <button class="btn btn-secondary" id="btn-p3-back" style="flex:1;">Change</button>
            <button class="btn btn-primary" id="btn-p3-confirm" style="flex:2;">Confirm payment</button>
          </div>
        </div>

        <!-- STEP 4: Success -->
        <div class="pay-step" id="pstep-4" style="text-align:center;padding:40px 0;">
          <div class="success-circle" style="margin-bottom:16px;">
            <svg viewBox="0 0 32 32"><polyline points="6 16 13 23 26 9"/></svg>
          </div>
          <div style="font-size:20px;font-weight:700;color:var(--n-900);margin-bottom:4px;">Payment logged</div>
          <div style="font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--n-800);margin-bottom:20px;" id="succ-amount"></div>

          <div class="card card-sm" style="text-align:left;margin-bottom:24px;">
            <div style="font-size:12px;color:var(--n-400);margin-bottom:4px;">Paid from</div>
            <div style="font-size:16px;font-weight:700;" id="succ-section"></div>
            <div style="font-size:13px;color:var(--n-400);margin-top:2px;" id="succ-remaining"></div>
          </div>

          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="btn btn-primary btn-full" id="btn-pay-another">Log another payment</button>
            <a href="/pages/dashboard.html" class="btn btn-secondary btn-full">Back to home</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="bottom-nav-container"></div>
</div>

<div id="toast-container"></div>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/payment.js"></script>
</body>
</html>
