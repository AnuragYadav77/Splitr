<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitr — Dashboard</title>
  <meta name="description" content="Your budget dashboard — track sections, spending, and remaining balances.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">

  <!-- Sidebar (desktop) -->
  <div id="sidebar-container"></div>

  <!-- Main -->
  <div class="main">

    <!-- Mobile header -->
    <div id="mobile-header-container"></div>

    <!-- Page content -->
    <div class="page-wrap">
      <div class="page-inner page-enter">

        <!-- Greeting -->
        <div style="margin-bottom:24px;">
          <h1 class="page-title" id="greeting">Good evening</h1>
          <div class="page-subtitle" id="today-date"></div>
        </div>

        <!-- Monthly Summary -->
        <div id="summary-section">
          <div class="summary-grid" id="summary-grid">
            <!-- skeleton -->
            <div class="summary-card"><div class="skeleton skeleton-text" style="width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:28px;width:80%;"></div></div>
            <div class="summary-card"><div class="skeleton skeleton-text" style="width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:28px;width:80%;"></div></div>
            <div class="summary-card"><div class="skeleton skeleton-text" style="width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:28px;width:80%;"></div></div>
            <div class="summary-card"><div class="skeleton skeleton-text" style="width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:28px;width:80%;"></div></div>
          </div>
        </div>

        <!-- Insight -->
        <div id="insight-wrap" class="hidden" style="margin-bottom:24px;"></div>

        <!-- Your Sections -->
        <div style="margin-bottom:24px;">
          <div class="section-label">
            Your sections
            <a href="/pages/sections.html" class="btn btn-ghost btn-sm" style="padding:4px 10px;font-size:12px;">+ Add section</a>
          </div>
          <div class="sections-grid" id="sections-grid">
            <!-- skeleton -->
            <div class="card" style="min-height:130px;"><div class="skeleton" style="height:100%;min-height:130px;border-radius:var(--r-md);"></div></div>
            <div class="card" style="min-height:130px;"><div class="skeleton" style="height:100%;min-height:130px;border-radius:var(--r-md);"></div></div>
            <div class="card" style="min-height:130px;"><div class="skeleton" style="height:100%;min-height:130px;border-radius:var(--r-md);"></div></div>
            <div class="card" style="min-height:130px;"><div class="skeleton" style="height:100%;min-height:130px;border-radius:var(--r-md);"></div></div>
          </div>
        </div>

        <!-- Two column: Activity + Upcoming -->
        <div id="bottom-grid" style="display:grid;grid-template-columns:1fr;gap:20px;">

          <!-- Recent Activity -->
          <div>
            <div class="section-label">
              Recent activity
              <a href="/pages/transactions.html" class="btn btn-ghost btn-sm" style="padding:4px 10px;font-size:12px;">View all</a>
            </div>
            <div class="card card-sm">
              <div class="tx-list" id="tx-list">
                <div class="skeleton skeleton-text" style="margin-bottom:10px;"></div>
                <div class="skeleton skeleton-text" style="margin-bottom:10px;"></div>
                <div class="skeleton skeleton-text"></div>
              </div>
              <div id="tx-empty" class="hidden" style="text-align:center;padding:24px 0;color:var(--n-400);font-size:13px;">
                No transactions yet.<br>
                <a href="/pages/transactions.html" class="text-indigo" style="font-weight:600;margin-top:8px;display:inline-block;">Add your first transaction</a>
              </div>
            </div>
          </div>

          <!-- Upcoming Bills -->
          <div id="bills-section" class="hidden">
            <div class="section-label">
              Upcoming bills
              <a href="/pages/bills.html" class="btn btn-ghost btn-sm" style="padding:4px 10px;font-size:12px;">View all</a>
            </div>
            <div class="card card-sm">
              <div id="bills-list"></div>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- Bottom nav (mobile) -->
  <div id="bottom-nav-container"></div>

</div>

<div id="toast-container"></div>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
