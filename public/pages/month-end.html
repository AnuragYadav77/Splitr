<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitr — Month-End Review</title>
  <meta name="description" content="Review your month, sweep remaining budget to savings, and set new budgets for next month.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">

  <div id="sidebar-container"></div>

  <div class="main">
    <div id="mobile-header-container"></div>
    <div class="page-wrap">
      <div class="page-inner page-enter" style="max-width:560px;">

        <button class="back-btn" id="back-btn">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back to settings
        </button>

        <h1 class="page-title" style="margin-bottom:4px;">Month-End Review</h1>
        <p class="page-subtitle" style="margin-bottom:28px;" id="month-label">Review this month before starting fresh.</p>

        <!-- Loading -->
        <div id="me-loading">
          <div class="skeleton skeleton-block" style="height:100px;margin-bottom:16px;"></div>
          <div class="skeleton skeleton-block" style="height:60px;margin-bottom:8px;"></div>
          <div class="skeleton skeleton-block" style="height:60px;margin-bottom:8px;"></div>
        </div>

        <!-- Content -->
        <div id="me-content" class="hidden">

          <!-- Month summary -->
          <div class="section-label">This month's summary</div>
          <div class="card card-sm" style="margin-bottom:24px;" id="month-summary"></div>

          <!-- Sweep amount -->
          <div class="insight-card" style="margin-bottom:24px;" id="sweep-card">
            <div class="insight-icon">
              <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            </div>
            <div class="insight-text" id="sweep-text">Calculating…</div>
          </div>

          <!-- Set next month budgets -->
          <div class="section-label">Set next month's budgets</div>
          <p style="font-size:13px;color:var(--n-400);margin-bottom:14px;">Adjust each section's budget for the new month.</p>
          <div id="budgets-list" style="margin-bottom:24px;"></div>

          <!-- Confirm button -->
          <button class="btn btn-primary btn-full btn-lg" id="btn-confirm-rollover">
            Start New Month
          </button>
          <p style="font-size:11px;color:var(--n-400);text-align:center;margin-top:10px;">
            This will reset all section spending and move remaining budgets to savings.
          </p>

        </div>

      </div>
    </div>
  </div>

  <div id="bottom-nav-container"></div>
</div>

<div id="toast-container"></div>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/month-end.js"></script>
</body>
</html>
