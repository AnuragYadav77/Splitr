<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitr — Savings</title>
  <meta name="description" content="Track your savings goals and deposit money towards them.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">

  <div id="sidebar-container"></div>

  <div class="main">
    <div id="mobile-header-container"></div>
    <div class="page-wrap">
      <div class="page-inner page-enter">

        <div class="page-head">
          <div>
            <h1 class="page-title">Savings</h1>
            <p class="page-subtitle">Your goals and progress</p>
          </div>
          <button class="btn btn-primary" id="btn-add-goal">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New goal
          </button>
        </div>

        <!-- Total saved -->
        <div id="savings-summary" class="hidden card card-sm" style="margin-bottom:20px;background:var(--indigo-50);border-color:var(--indigo-100);">
          <div style="font-size:12px;font-weight:600;color:var(--indigo-600);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Total saved</div>
          <div style="font-size:28px;font-weight:700;color:var(--indigo-700);letter-spacing:-1px;" id="total-saved">₹0</div>
          <div style="font-size:13px;color:var(--indigo-600);margin-top:2px;" id="goals-count">Across 0 goals</div>
        </div>

        <!-- Goals list -->
        <div id="goals-grid" style="display:flex;flex-direction:column;gap:12px;">
          <div class="skeleton skeleton-block" style="height:120px;"></div>
          <div class="skeleton skeleton-block" style="height:120px;"></div>
        </div>

        <!-- Empty -->
        <div id="goals-empty" class="hidden empty-state">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
          </div>
          <div class="empty-state-title">No savings goals</div>
          <div class="empty-state-desc">Create goals for things you're saving towards — emergency fund, vacation, gadgets.</div>
          <button class="btn btn-primary" id="empty-add-goal">Create first goal</button>
        </div>

      </div>
    </div>
  </div>

  <div id="bottom-nav-container"></div>
</div>

<!-- Create Goal Modal -->
<div class="overlay" id="add-goal-overlay" role="dialog" aria-modal="true" aria-labelledby="add-goal-title">
  <div class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-title" id="add-goal-title">New savings goal</div>

    <div class="input-group">
      <label class="input-label" for="goal-name">Goal name</label>
      <input type="text" id="goal-name" class="input" placeholder="e.g. Emergency Fund, New Laptop" maxlength="60">
      <div class="input-error-msg" id="err-goal-name"></div>
    </div>

    <div class="input-group">
      <label class="input-label" for="goal-target">Target amount</label>
      <div class="input-prefix-wrap">
        <span class="input-prefix">₹</span>
        <input type="number" id="goal-target" class="input" placeholder="0" min="1" inputmode="numeric">
      </div>
      <div class="input-error-msg" id="err-goal-target"></div>
    </div>

    <div class="input-group">
      <label class="input-label" for="goal-deadline">Deadline <span style="color:var(--n-400);font-weight:400;">(optional)</span></label>
      <input type="date" id="goal-deadline" class="input">
    </div>

    <div id="goal-form-error" class="hidden" style="background:var(--red-50);border:1px solid var(--red-100);color:var(--red-600);font-size:13px;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:14px;"></div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" id="btn-goal-cancel" style="flex:1;">Cancel</button>
      <button class="btn btn-primary" id="btn-goal-create" style="flex:2;">Create goal</button>
    </div>
  </div>
</div>

<!-- Deposit/Withdraw Modal -->
<div class="overlay" id="deposit-overlay" role="dialog" aria-modal="true" aria-labelledby="deposit-title">
  <div class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-title" id="deposit-title">Add to goal</div>
    <div class="sheet-subtitle" id="deposit-subtitle">Deposit money into this goal.</div>
    <input type="hidden" id="deposit-goal-id">

    <div style="display:flex;gap:8px;margin-bottom:16px;" id="deposit-type-tabs">
      <button class="pill-filter-btn active" id="tab-deposit" data-type="deposit">Deposit</button>
      <button class="pill-filter-btn" id="tab-withdraw" data-type="withdraw">Withdraw</button>
    </div>

    <div class="input-group">
      <label class="input-label" for="deposit-amount">Amount</label>
      <div class="input-prefix-wrap">
        <span class="input-prefix">₹</span>
        <input type="number" id="deposit-amount" class="input" placeholder="0" min="1" inputmode="numeric">
      </div>
      <div class="input-error-msg" id="err-deposit-amount"></div>
    </div>

    <div id="deposit-error" class="hidden" style="background:var(--red-50);border:1px solid var(--red-100);color:var(--red-600);font-size:13px;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:14px;"></div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" id="btn-deposit-cancel" style="flex:1;">Cancel</button>
      <button class="btn btn-primary" id="btn-deposit-confirm" style="flex:2;">Confirm</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/savings.js"></script>
</body>
</html>
